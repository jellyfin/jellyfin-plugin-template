name: '📝 Create/Update Release Draft & Release Bump PR'

on:
  push:
    branches:
      - master
    paths-ignore:
      - build.yaml
  workflow_dispatch:
  repository_dispatch:
    types:
      - update-prep-command

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/changelog.yaml@601009caac9d7e9f891ef8ed8bb9446490b7c1c1 # master
    with:
      repository-name: jellyfin/jellyfin-plugin-template
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
